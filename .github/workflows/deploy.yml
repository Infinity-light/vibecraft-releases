name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact private VibeCraft source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vibecraft
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require an immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Infinity-light/vibecraft
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          ref: ${{ inputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build and test the server
        run: |
          pnpm install --frozen-lockfile --filter server...
          pnpm --filter server test --runInBand --silent
          pnpm --filter server build
          tar -czf "vibecraft-server-dist-${{ github.run_id }}.tgz" -C apps/server dist

      - name: Transfer compiled server to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: vibecraft-server-dist-${{ github.run_id }}.tgz
          target: /tmp/

      - name: Deploy the server and verify marketplace routes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -eu
            cd /opt/apps/vibecraft
            test -s .env
            test -d apps/server/dist
            compose() { docker compose -f docker-compose.prod.yml "$@"; }
            compose config --quiet
            old_container=$(compose ps -q server)
            test -n "$old_container"
            old_image=$(docker inspect --format '{{.Image}}' "$old_container")
            image_ref=$(docker inspect --format '{{.Config.Image}}' "$old_container")
            test "$(docker inspect --format '{{.State.Running}}' "$old_container")" = true
            stage=$(mktemp -d apps/server/.retire-frontend-design.XXXXXX)
            tar -xzf "/tmp/vibecraft-server-dist-${{ github.run_id }}.tgz" -C "$stage"
            test -s "$stage/dist/skills/utils/available-version.js"
            rollback() {
              code=$?
              if [ "$code" -ne 0 ] && [ -d "$stage/previous-dist" ]; then
                if [ -d apps/server/dist ]; then mv apps/server/dist "$stage/failed-dist"; fi
                mv "$stage/previous-dist" apps/server/dist
                docker image tag "$old_image" "$image_ref"
                compose up -d --no-deps --no-build server
              fi
            }
            trap rollback EXIT
            mv apps/server/dist "$stage/previous-dist"
            mv "$stage/dist" apps/server/dist
            compose build server
            compose up -d --no-deps --no-build server
            api=http://127.0.0.1:3001
            curl -fsS --retry 12 --retry-delay 2 --retry-all-errors "$api/health" >/dev/null
            for entry in \
              '6dcf8acd-40f1-4336-83f5-6d87b821ea16 5.39.0 6.3.0' \
              '141ebf99-59a4-4b8d-8ebb-b524a826cbee 5.33.1-codex.5 6.2.0%2Bcodex.20261127' \
              '5079be08-185b-4737-8cd1-513210b8b6f5 1.0.0 1.0.1'
            do
              set -- $entry
              test "$(curl -sS -o /dev/null -w '%{http_code}' "$api/skills/$1/files?version=$2")" = 404
              curl -fsS "$api/skills/$1/files?version=$3" >/dev/null
              printf 'Verified historical %s withdrawn and current %s available\n' "$2" "$3"
            done
            trap - EXIT
            rm -f "/tmp/vibecraft-server-dist-${{ github.run_id }}.tgz"
